name: ofb8
description: "A place which lists and helps find beautiful places across the world."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^3.1.0
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  hive: ^2.2.3
  intl: ^0.20.2
  json_annotation: ^4.9.0
  oktoast: ^3.4.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pretty_dio_logger: ^1.4.0
  pull_to_refresh: ^2.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.4
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/2x/
    - assets/icons/3x/
    - assets/app/
